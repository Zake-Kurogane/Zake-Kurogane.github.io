<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Lloyd Aguirre — Portfolio</title>

  <!-- GitHub Pages serves static files only, so there is no server-side 301.
       A meta refresh plus a script redirect is the closest equivalent, and the
       canonical link keeps search engines pointed at the real address. -->
  <meta http-equiv="refresh" content="0; url=./Portfolio/">
  <link rel="canonical" href="https://zake-kurogane.github.io/Portfolio/">
  <link rel="icon" href="./Portfolio/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font: 500 15px/1.6 'Inter', system-ui, -apple-system, sans-serif;
      background: #060b11; color: #e8eef5;
      text-align: center; padding: 24px;
    }
    h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px }
    p { margin: 0 0 22px; color: #93a4b8; font-size: 14px }
    a {
      display: inline-block; padding: 12px 24px; border-radius: 999px;
      background: linear-gradient(135deg, #3bb7f3, #0d8dcb);
      color: #fff; font-weight: 600; text-decoration: none; font-size: 14px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #1aacf0;
      display: inline-block; margin-right: 7px; vertical-align: middle;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  </style>
</head>
<body>
  <div>
    <h1><span class="dot"></span>This portfolio has moved</h1>
    <p>Taking you to <strong>zake-kurogane.github.io/Portfolio</strong>…</p>
    <a href="./Portfolio/">Go to the portfolio</a>
  </div>
  <script>location.replace('./Portfolio/');</script>
</body>
</html>
